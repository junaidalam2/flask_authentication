{% extends "base.html" %}

{% block content %}
<div class="column is-4 is-offset-4">
    <h3 class="title has-text-centered">Reset Password</h3>
    <div class="box">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="notification is-{{ category }}">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <label class="label">New Password<span>*</span></label>
                <div class="control">
                    <input class="input" type="password" name="password" placeholder="New password" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Confirm Password<span>*</span></label>
                <div class="control">
                    <input class="input" type="password" name="confirm_password" placeholder="Confirm new password" required>
                </div>
            </div>

            <button type="submit" class="button is-block is-info is-large is-fullwidth">Reset Password</button>
        </form>

    </div>
</div>
{% endblock %}
