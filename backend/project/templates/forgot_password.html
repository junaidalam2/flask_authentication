{% extends "base.html" %}

{% block content %}
<div class="column is-4 is-offset-4">
    <h3 class="title has-text-centered">Forgot Password</h3>
    <div class="box">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="notification is-{{ category }}">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <label class="label">Email<span>*</span></label>
                <div class="control">
                    <input class="input" type="email" name="email" placeholder="Enter your account email" required>
                </div>
            </div>

            <button type="submit" class="button is-block is-info is-large is-fullwidth">Send reset link</button>
        </form>

        <p class="has-text-centered mt-3">
            <a href="{{ url_for('auth.login') }}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
